[project]
name = "patient360"
version = "0.1.0"
description = "Patient-360 pilot: AI service (contracts, domain logic, adapters)"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.26.0",
    "azure-storage-blob>=12.31.0",
    "azure-storage-queue>=12.18.0",
    "boto3>=1.43.118",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "json-repair>=0.64.2",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "import-linter>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient360"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.importlinter]
root_package = "patient360"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain stays pure: no I/O libraries"
type = "forbidden"
source_modules = ["patient360.domain"]
forbidden_modules = ["boto3", "botocore", "psycopg", "psycopg_pool", "azure", "fastapi", "httpx", "requests", "structlog"]
